name: Graphitree
options:
  bundleIdPrefix: com.marcuslai
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: P7DV5ZUK9A
    # Sparkle compares CFBundleVersion to find updates, so it follows the version.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    MARKETING_VERSION: 0.6.0
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  # Graphitree › Check for Updates…, from the releases on GitHub (Scripts/release.sh).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  Graphitree:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Graphitree
        CFBundleName: Graphitree
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSDocumentsFolderUsageDescription: Graphitree reads your knowledge graph and checks its source files in Documents.
        # Updates: the feed is each GitHub release's appcast.xml, made by Scripts/release.sh and
        # signed with the private half of this key, which is in the owner's login Keychain.
        SUFeedURL: https://github.com/MarcusLai07/graphitree/releases/latest/download/appcast.xml
        SUPublicEDKey: neQwSCpnsCiyBXtzEFWB0oRQ0LsA2AnH2hdcTXoYa1k=
        SUEnableAutomaticChecks: true
        SUVerifyUpdateBeforeExtraction: true
        # The folder shared with the widget (WidgetFeedStore). Team-prefixed, so macOS lets both
        # use it without a provisioning profile or a prompt; another team's build uses its own.
        GraphitreeAppGroup: $(TeamIdentifierPrefix)com.marcuslai.Graphitree
        # Widgets and notifications open graphitree://usage?plan=claude.
        CFBundleURLTypes:
          - CFBundleURLName: com.marcuslai.Graphitree
            CFBundleURLSchemes: [graphitree]
    # Not sandboxed: it reads ~/Documents/GitHub and runs graphify. Its one entitlement is the
    # folder it shares with the widget.
    entitlements:
      path: App/Graphitree.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.marcuslai.Graphitree
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslai.Graphitree
        # App/Resources/AppIcon.icon, made in Icon Composer's format from design/AppIcon (Scripts/icon.sh).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GRDB
      - package: Sparkle
      # The desktop widgets, in Contents/PlugIns.
      - target: GraphitreeWidget
      # The `graphitree` command line ships inside the app, next to its executable.
      - target: GraphitreeCLI
        embed: true
        codeSign: true
        copy:
          destination: executables
  # The desktop widgets: the plan's limits as bars or rings. Widgets must be sandboxed, so this
  # only draws the feed Graphitree writes into their shared folder (Shared/Usage/WidgetFeed.swift),
  # and compiles just the usage files that drawing needs.
  GraphitreeWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes: ["Info.plist", "GraphitreeWidget.entitlements"]
      - App/Views/Palette.swift
      - App/Views/Usage/UsageTheme.swift
      - App/Views/Usage/MetricPresentation.swift
      - App/Views/Usage/Meters.swift
      - Shared/Usage/UsageModels.swift
      - Shared/Usage/UsageProvider.swift
      - Shared/Usage/UsageTrends.swift
      - Shared/Usage/UsageHistory.swift
      - Shared/Usage/ClaudeUsageStore.swift
      - Shared/Usage/WidgetFeed.swift
      - path: App/Resources/ModelLogos/ModelLogo-claude-code.png
        buildPhase: resources
      - path: App/Resources/ModelLogos/ModelLogo-codex.png
        buildPhase: resources
      - path: App/Resources/ModelLogos/ModelLogo-gemini-cli.png
        buildPhase: resources
      - path: App/Resources/ModelLogos/ModelLogo-copilot.png
        buildPhase: resources
      - path: App/Resources/ModelLogos/ModelLogo-opencode.png
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Graphitree
        CFBundleName: Graphitree
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GraphitreeAppGroup: $(TeamIdentifierPrefix)com.marcuslai.Graphitree
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/GraphitreeWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.marcuslai.Graphitree
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslai.Graphitree.Widget
  GraphitreeChecks:
    type: tool
    platform: macOS
    sources: [Tests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslai.Graphitree.Checks
    dependencies:
      - package: GRDB
  GraphitreeCLI:
    type: tool
    platform: macOS
    sources: [CLI, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslai.Graphitree.CLI
        PRODUCT_NAME: graphitree-cli
    dependencies:
      - package: GRDB
  GraphitreeShots:
    type: tool
    platform: macOS
    sources:
      - path: App
        excludes: ["GraphitreeApp.swift", "Updates.swift", "Info.plist", "Resources/**"]
      - Shared
      - Shots
      # The widgets' views, drawn with sample entries (Shots/WidgetShot.swift).
      - path: Widget
        excludes: ["WidgetBundle.swift", "Info.plist", "GraphitreeWidget.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslai.Graphitree.Shots
    dependencies:
      - package: GRDB
