<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src 'unsafe-inline'">
  <style>
    html, body, #canvas { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { position: relative; }
    #under, #over, #canvas { position: absolute; left: 0; top: 0; }
    #under, #over { width: 100%; height: 100%; pointer-events: none; }
    #areas { position: absolute; inset: 0; pointer-events: none; }
    .area {
      position: absolute;
      transform: translate(-50%, -100%);
      font: 600 11px -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0.02em;
      color: var(--label);
      white-space: nowrap;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <canvas id="under"></canvas>
  <div id="canvas"></div>
  <canvas id="over"></canvas>
  <div id="areas"></div>
  <script src="graph.bundle.js"></script>
</body>
</html>
